spring.application.name=cvo-gateway-service
server.port=8080

service.utter-service.url=${UTTER_SERVICE_URL:http://localhost:8081}
service.person-service.url=${NPC_SERVICE_URL:http://localhost:8082}
service.credit-service.url=${CREDIT_SERVICE_URL:http://localhost:8083}

spring.cloud.gateway.server.webflux.routes[0].id=person-service
spring.cloud.gateway.server.webflux.routes[0].uri=${service.person-service.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/person/**,/api/v1/people
