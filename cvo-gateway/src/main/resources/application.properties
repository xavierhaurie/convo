spring.application.name=cvo-gateway-service
server.port=8080

service.cvofile-service.url=${CVO_FILE_SERVICE_URL:http://localhost:8081}
service.person-service.url=${NPC_SERVICE_URL:http://localhost:8082}
service.converse-service.url=${CREDIT_SERVICE_URL:http://localhost:8083}

spring.cloud.gateway.server.webflux.routes[0].id=cvofile-service
spring.cloud.gateway.server.webflux.routes[0].uri=${service.cvofile-service.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/file/**,/api/v1/files

spring.cloud.gateway.server.webflux.routes[1].id=person-service
spring.cloud.gateway.server.webflux.routes[1].uri=${service.person-service.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/person/**,/api/v1/persons

spring.cloud.gateway.server.webflux.routes[2].id=converse-service
spring.cloud.gateway.server.webflux.routes[2].uri=${service.converse-service.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/utterance/**,/api/v1/utterances
