spring.application.name=person-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/person?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true

# this is profiles as per Spring Boot, not the NPC profiles. Set to "gcp" to use Google Cloud Storage, or anything else (e.g. "local") to use local storage.
# set to "gcp" to use Google Cloud Storage, or anything else (e.g. "local") to use local storage.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

